<text class="p" x="1385" y="548" >바깥 720 · 안쪽 680 · 폭 20 (실측)</text>
<text class="p" x="1385" y="574" >중심선은 150~850 사이 700 × 700 사각형</text>
<text class="p" x="1385" y="600" >모서리 곡선 구역 150 × 150 (실측)</text>
<text class="p" x="1385" y="626" >→ 바깥 가장자리 반지름 150, 중심선 140로 해석</text>
<text class="h2" x="1385" y="680" >갈림길</text>
<text class="p" x="1385" y="708" >벌어짐은 바깥 가장자리끼리 잰 값으로 해석</text>
<text class="p" x="1385" y="734" >왼쪽: 최대 100 (실측)</text>
<text class="p" x="1385" y="760" >   y 390에서 갈라져 y 585에서 합류 (추정)</text>
<text class="p" x="1385" y="786" >오른쪽 S자: 오른쪽 위 모서리에서 갈라짐</text>
<text class="p" x="1385" y="812" >   → 안쪽으로 최대 150 (실측)</text>
<text class="p" x="1385" y="838" >   → 노랑 가운데 (850, 500)에서 직선과 교차</text>
<text class="p" x="1385" y="864" >   → 바깥으로 최대 150 (실측)</text>
<text class="p" x="1385" y="890" >   → 오른쪽 아래 모서리 시작에서 합류</text>
<text class="h2" x="1385" y="940" >같은 축척 크기 비교</text>
